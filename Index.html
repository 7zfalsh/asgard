<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сага Асгарда</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0d1520;--pan:#16222f;--pan2:#1e2f40;--tx:#e9e0c8;--mut:#8fa0ad;--gold:#d8a94c;--ice:#7fb4c9;--red:#c0503f;--grn:#5fae7a;--r1:#6b8aa0;--r2:#a67bd1;--r3:#e0a840;box-sizing:border-box}
*{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.35 system-ui,-apple-system,Roboto,sans-serif;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding-top:env(safe-area-inset-top,0px);user-select:none}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--pan);border-bottom:1px solid #2a3d50}
header h1{font:800 17px Cinzel,Georgia,serif;margin:0;color:var(--gold);letter-spacing:.5px}
.res{display:flex;gap:12px;font-weight:600}
main{flex:1;overflow-y:auto;padding:12px 12px 8px}
nav{display:flex;background:var(--pan);border-top:1px solid #2a3d50;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:7px 0;line-height:1.25;font:600 11px system-ui;border-top:3px solid transparent}
nav button.on{color:var(--gold);border-top-color:var(--gold)}
.arena{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:330px;padding:14px 10px;border-radius:14px;background:radial-gradient(120% 90% at 50% 0,#25405a 0,#13202e 70%);border:1px solid #2f4760}
.col{display:flex;flex-direction:column;gap:10px;width:42%}
.u{position:relative;text-align:center;transition:opacity .3s}
.u b{display:block;font-size:34px;font-weight:400}
.u.dead{opacity:.15;filter:grayscale(1)}
.bar{height:6px;background:#0a1018;border-radius:3px;overflow:hidden;margin:2px 8%}
.bar span{display:block;height:100%;background:var(--grn)}
.en .bar span{background:var(--red)}
.pop{position:absolute;left:50%;top:-4px;font:700 14px system-ui;color:#fff;text-shadow:0 1px 3px #000;animation:up .6s ease-out forwards;pointer-events:none}
@keyframes up{to{transform:translateY(-22px);opacity:0}}
.info{display:flex;justify-content:space-between;margin:10px 2px;color:var(--mut)}
.info b{color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.card{position:relative;background:var(--pan);border:2px solid var(--r1);border-radius:10px;padding:8px 2px;text-align:center}
.card.r2{border-color:var(--r2)}.card.r3{border-color:var(--r3)}
.card b{display:block;font-size:28px;font-weight:400}
.card small{display:block;font-size:11px;color:var(--mut)}
.card.lock{opacity:.35}
.card.sel{background:var(--pan2);box-shadow:0 0 0 2px var(--ice)}
.card em{position:absolute;top:1px;right:4px;font-style:normal;font-size:12px}
.panel{background:var(--pan);border-radius:12px;padding:12px;margin-top:12px;border:1px solid #2a3d50}
.panel h2{font:800 18px Cinzel,Georgia,serif;margin:0 0 4px}
.row{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:12px 8px;border:0;border-radius:10px;background:var(--gold);color:#1a1205;font:700 15px system-ui}
.btn.alt{background:var(--pan2);color:var(--tx);border:1px solid #3a5169}
.btn:disabled{opacity:.4}
.btn:active{transform:scale(.97)}
.pulls{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#000c;border:1px solid var(--gold);padding:8px 14px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.fbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 14px;background:var(--pan2);font-size:13px}
.sp{display:flex;justify-content:center;gap:6px;padding:4px 12px;background:var(--bg);border-top:1px solid #2a3d50}
.sp button{flex:1;max-width:72px;padding:5px 0;border-radius:8px;border:1px solid #3a5169;background:var(--pan2);color:var(--mut);font:700 13px system-ui}
.sp button.on{background:var(--gold);color:#1a1205;border-color:var(--gold)}
.uf{flex-basis:100%;display:flex;justify-content:center;flex-wrap:wrap;gap:6px}
.uf span{background:#d8a94c33;border:1px solid var(--gold);color:var(--gold);border-radius:12px;padding:2px 10px;font-size:12px;font-weight:700}
.sk{display:flex;flex-wrap:wrap;row-gap:4px;justify-content:center;gap:8px;padding:5px 12px;background:var(--bg);border-top:1px solid #2a3d50}
.sk1{width:48px;text-align:center;border:1px solid #2f4760;border-radius:8px;background:var(--pan);padding:2px 0;font-size:18px;line-height:1.15}
.sk1 small{display:block;font-size:10px;color:var(--mut)}
.sk1.rdy{border-color:var(--gold)}
.sk1.rdy small{color:var(--gold)}
.sk1.fire{border-color:var(--gold);background:#d8a94c55;box-shadow:0 0 8px var(--gold)}
.sk1.fire small{color:var(--gold);font-weight:700}
.ub{display:flex;gap:6px;padding:6px 12px;background:var(--bg);border-bottom:1px solid #2a3d50}
.ub button{flex:1;border:1px solid #3a5169;border-radius:10px;padding:5px 0;background:linear-gradient(90deg,#d8a94c66 var(--p,0%),var(--pan2) var(--p,0%));color:var(--tx);font:600 18px/1.1 system-ui}
.ub button small{display:block;font-size:10px;color:var(--mut)}
.ub button.rd{border-color:var(--gold);color:var(--gold)}
.ub button:disabled{opacity:1}
.ub button:active{transform:scale(.96)}
.hint{color:var(--mut);font-size:13px;margin:6px 2px}
</style>
</head>
<body>
<header><h1>Сага Асгарда</h1><div class="res"><span id="g">🪙 0</span><span id="m">💎 0</span></div></header>
<div class="fbar" id="fb"></div>
<div class="ub" id="ub"></div>
<main id="main"></main>
<div class="sp" id="sp"></div>
<div class="sk" id="sk"></div>
<nav>
<button data-t="b" class="on">⚔<br>Бой</button>
<button data-t="h">🛡<br>Герои</button>
<button data-t="s">✨<br>Призыв</button>
<button data-t="r">🏺<br>Реликвии</button>
<button data-t="m">🏰<br>Режимы</button>
<button data-t="v">🏘<br>Деревня</button>
</nav>
<div class="toast" id="toast"></div>
<script>
const H=[
{id:'thor',n:'Тор',e:'⚡',r:3,t:'dmg',hp:120,atk:16},
{id:'odin',n:'Один',e:'👁️',r:3,t:'mage',hp:100,atk:18},
{id:'loki',n:'Локи',e:'🎭',r:3,t:'dmg',hp:90,atk:21},
{id:'freya',n:'Фрейя',e:'🌸',r:3,t:'heal',hp:95,atk:10},
{id:'hel',n:'Хель',e:'💀',r:2,t:'mage',hp:90,atk:15},
{id:'tyr',n:'Тюр',e:'🛡️',r:2,t:'tank',hp:170,atk:9},
{id:'fen',n:'Фенрир',e:'🐺',r:2,t:'dmg',hp:110,atk:15},
{id:'bal',n:'Бальдр',e:'☀️',r:1,t:'heal',hp:85,atk:9},
{id:'ska',n:'Скади',e:'❄️',r:1,t:'dmg',hp:80,atk:13},
{id:'hei',n:'Хеймдалль',e:'📯',r:1,t:'tank',hp:140,atk:8}];
const CL={dmg:'Воин',mage:'Маг',heal:'Целитель',tank:'Страж'};
const $=s=>document.querySelector(s);
const get=id=>H.find(h=>h.id===id);
let S=null;
try{S=JSON.parse(localStorage.getItem('sa1'))}catch(e){}
if(!S)S={gems:1000,gold:300,own:{thor:{l:1,s:0},tyr:{l:1,s:0},freya:{l:1,s:0}},team:['thor','tyr','freya'],stage:1,max:1,farm:false,t:Date.now()};
S.max=Math.max(S.max||1,S.stage);S.farm=!!S.farm;S.rel=S.rel||{};S.tw=S.tw||1;S.q=S.q||{d:'',p:{},c:{}};S.wb=S.wb||'';S.rn=S.rn||0;S.asc=S.asc||0;S.ru=S.ru||{};S.vl=S.vl||{};S.auto=!!S.auto;S.sp=S.sp||1;
const save=()=>{S.t=Date.now();try{localStorage.setItem('sa1',JSON.stringify(S))}catch(e){}};
const pw=(id,k)=>{const o=S.own[id];return Math.round(get(id)[k]*(1+.18*(o.l-1))*(1+.25*o.s)*(1+rb(k)+ru(k)+vb(k)))};
let tab='b',sel='thor',B=null,res=[],M='st';
const dk=()=>new Date().toISOString().slice(0,10),wi=s=>Math.floor((s-1)/10);
const W=['Мидгард','Ётунхейм','Нифльхейм','Муспельхейм','Хельхейм','Асгард'];
const WE=[['🧌','👹','🦴','🐍','🐗'],['🧊','👺','🦣','🐺','🐻'],['🥶','👻','🦌','🐧','🦉'],['🔥','😈','🌋','🦂','🐲'],['💀','🧟','🕷️','🦇','👻'],['⚡','🗿','🦅','🐂','👑']];
const R=[{id:'ham',n:'Мьёльнир',e:'🔨',k:'atk',v:.08,d:'урон'},{id:'shd',n:'Эгида',e:'🛡️',k:'hp',v:.08,d:'здоровье'},{id:'rng',n:'Драупнир',e:'💍',k:'gold',v:.1,d:'золото'},{id:'hrn',n:'Гьяллархорн',e:'📯',k:'off',v:.15,d:'оффлайн-доход'},{id:'apl',n:'Яблоко Идунн',e:'🍎',k:'hp',v:.05,d:'здоровье'},{id:'spr',n:'Гунгнир',e:'🔱',k:'atk',v:.05,d:'урон'}];
const rb=k=>R.reduce((a,r)=>a+(r.k==k?r.v*(S.rel[r.id]||0):0),0),rcost=l=>Math.round(150*Math.pow(l,1.7));
const Q=[{id:'win',n:'Победить в 10 боях',g:10,r:30},{id:'up',n:'Усилить героев 5 раз',g:5,r:30},{id:'sum',n:'Призвать героев 3 раза',g:3,r:40}];
function qd(){if(S.q.d!=dk())S.q={d:dk(),p:{},c:{}}}
function qp(id,n=1){qd();S.q.p[id]=(S.q.p[id]||0)+n}
function qc(id){qd();const q=Q.find(x=>x.id==id);if((S.q.p[id]||0)<q.g||S.q.c[id])return;S.q.c[id]=1;S.gems+=q.r;save();hdr();modes();toast('+'+q.r+' 💎')}
const X={
thor:{d:'Громовержец, сильнейший воин Асгарда. Бьёт мощно по одной цели и вдохновляет союзников.',a:{k:'atk',v:.08},at:'+8% к урону остальных союзников',s:'Молния Мьёльнира',sd:'удар ×3 по первому врагу',cd:3},
odin:{d:'Всеотец, владыка мудрости. Его копьё поражает всех врагов, а знания приносят богатство.',a:{k:'gold',v:.12},at:'+12% золота за победу',s:'Копьё Гунгнир',sd:'удар ×1 по всем врагам',cd:3},
loki:{d:'Хитрый обманщик. Метит в самого слабого врага и быстро убирает его с поля.',a:{k:'atk',v:.06},at:'+6% к урону остальных союзников',s:'Подлый удар',sd:'×2.5 по врагу с наименьшим здоровьем',cd:3},
freya:{d:'Богиня любви и войны. Лечит всю команду и укрепляет её.',a:{k:'hp',v:.08},at:'+8% к здоровью остальных союзников',s:'Дар Фрейи',sd:'лечит всех союзников на 12% их здоровья',cd:2},
hel:{d:'Повелительница мёртвых. Забирает силы врагов и ослабляет их удары.',a:{k:'ea',v:.08},at:'враги бьют на 8% слабее',s:'Жатва душ',sd:'×0.8 по всем врагам, половина урона лечит саму Хель',cd:3},
tyr:{d:'Однорукий бог войны и чести. Принимает удары на себя и прикрывает союзников.',a:{k:'hp',v:.1},at:'+10% к здоровью остальных союзников',s:'Щит Тюра',sd:'все союзники получают щит в 12% здоровья Тюра',cd:3},
fen:{d:'Огромный волк, чудовище Рагнарёка. Яростно кусает цель и быстро заканчивает бой.',a:{k:'atk',v:.05},at:'+5% к урону остальных союзников',s:'Свирепый укус',sd:'×1.8 по первому врагу',cd:2},
bal:{d:'Светлый бог, любимец всех. Его свет возвращает павших союзников в бой.',a:{k:'hp',v:.06},at:'+6% к здоровью остальных союзников',s:'Возрождение',sd:'воскрешает павшего союзника с 30% здоровья, иначе лечит слабейшего на 30%',cd:5},
ska:{d:'Богиня зимы и охоты. Её ледяные стрелы замораживают врагов.',a:{k:'ea',v:.05},at:'враги бьют на 5% слабее',s:'Ледяная стрела',sd:'×2 по первому врагу, тот пропускает следующую атаку',cd:3},
hei:{d:'Страж моста Бифрёст. Его рог поднимает боевой дух всей команды.',a:{k:'gold',v:.08},at:'+8% золота за победу',s:'Зов Гьяллархорна',sd:'+30% урона всей команде на 3 хода',cd:4}};
const au=(k,ex)=>S.team.reduce((a,o)=>a+(o!=ex&&X[o].a.k==k?X[o].a.v:0),0);
let PW=1,UM=10,ar=0,tm;
const en_=()=>B.en.filter(x=>x.hp>0),al_=()=>B.al.filter(x=>x.hp>0),bf=()=>(B.buf>0?1.3:1)*PW;
const SK={
thor:u=>hit(en_()[0],Math.round(u.atk*3*bf())),
odin:u=>en_().forEach(x=>hit(x,Math.round(u.atk*bf()))),
loki:u=>hit(en_().sort((a,b)=>a.hp-b.hp)[0],Math.round(u.atk*2.5*bf())),
freya:u=>al_().forEach(x=>{const v=Math.round(x.mx*.12*PW);x.hp=Math.min(x.mx,x.hp+v);x.pop='+'+v}),
hel:u=>{let t=0;en_().forEach(x=>{const d=Math.round(u.atk*.8*bf());hit(x,d);t+=d});const v=Math.round(t/2);u.hp=Math.min(u.mx,u.hp+v);u.pop='+'+v},
tyr:u=>al_().forEach(x=>{x.sh=(x.sh||0)+Math.round(u.mx*.12*PW)}),
fen:u=>hit(en_()[0],Math.round(u.atk*1.8*bf())),
bal:u=>{const d=B.al.find(x=>x.hp<=0);if(d){d.hp=Math.min(d.mx,Math.round(d.mx*.3*PW));d.pop='✨'}else{const w=al_().sort((a,b)=>a.hp/a.mx-b.hp/b.mx)[0],v=Math.round(w.mx*.3*PW);w.hp=Math.min(w.mx,w.hp+v);w.pop='+'+v}},
ska:u=>{const t=en_()[0];hit(t,Math.round(u.atk*2*bf()));t.fr=1},
hei:u=>{B.buf=Math.round(3*PW)}};
function dmgA(t,d){if(t.sh){const a=Math.min(t.sh,d);t.sh-=a;d-=a}t.hp=Math.max(0,t.hp-d);t.pop='-'+d}
const inf=id=>{const x=X[id];return `<div class="hint" style="margin:6px 0">${x.d}</div><div style="font-size:13px;margin:4px 0">🌟 <b>Аура:</b> ${x.at}</div><div style="font-size:13px;margin:4px 0">✨ <b>${x.s}</b> (каждый ${x.cd}-й ход): ${x.sd}</div>`};
function drop(){if(Math.random()>.6)return'';const x=R[Math.random()*R.length|0];S.rel[x.id]=(S.rel[x.id]||0)+1;return x.e+' '+x.n}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.k);toast.k=setTimeout(()=>e.classList.remove('show'),1900)}
function fb(){const e=$('#fb');e.style.display=tab=='b'?'flex':'none';$('#ub').style.display=tab=='b'?'flex':'none';$('#sk').style.display=tab=='b'?'flex':'none';$('#sp').style.display=tab=='b'?'flex':'none';
 if(M!='st'){e.innerHTML=`<span>${M=='tw'?'🗼 Башня · этаж '+S.tw:'🐲 Мировой босс'}</span><button class="btn alt" style="flex:none;padding:6px 10px;font-size:13px" onclick="ex()">Выйти</button>`;return}
 e.innerHTML=`<span>${W[wi(S.stage)%6]} · ${S.farm?'🌾 фарм '+S.stage:'⚔ этап '+S.stage} · рекорд ${S.max}</span><button class="btn alt" style="flex:none;padding:6px 10px;font-size:13px" onclick="tf()">${S.farm?'Идти дальше':'Фармить'}</button>`}
function tf(){S.farm=!S.farm;save();fb();toast(S.farm?'Фарм: остаёмся на этапе':'Идём вперёд')}
function hdr(){$('#g').textContent='🪙 '+Math.floor(S.gold);$('#m').textContent='💎 '+S.gems+(S.rn?' ✨'+S.rn:'')}
function nb(){
 const al=S.team.map(id=>({id,e:get(id).e,hp:Math.round(pw(id,'hp')*(1+au('hp',id))),mx:Math.round(pw(id,'hp')*(1+au('hp',id))),atk:Math.round(pw(id,'atk')*(1+au('atk',id))),t:get(id).t,n:0,ch:0}));
 let en;
 if(M=='tw'){const f=S.tw,b=f%10==0,hp=Math.round(90*Math.pow(1.2,f)*(b?3:1)),a=Math.round(9*Math.pow(1.12,f)*(b?1.6:1));en=[0,1,2].map(i=>({e:b&&i==1?'👑':'🗿',hp,mx:hp,atk:a,n:0}))}
 else if(M=='wb')en=[{e:'🐲',hp:1e12,mx:1e12,atk:30+S.max*4,n:0,wb:1}];
 else{const s=S.stage,boss=s%5==0,E=WE[wi(s)%6];
  en=[0,1,2].map(i=>{const b=boss&&i==1,hp=Math.round(70*Math.pow(1.15,s)*(b?3:1));return{e:b?'🐉':E[(s+i)%5],hp,mx:hp,atk:Math.round(7*Math.pow(1.1,s)*(b?1.6:1)),n:0}})}
 const ea=Math.max(.5,1-au('ea'));en.forEach(x=>x.atk=Math.round(x.atk*ea));
 B={al,en,over:0,tk:0,dmg:0};ubuild();fb();draw()}
function hit(x,d){if(x.wb)B.dmg+=d;x.hp=Math.max(0,x.hp-d);x.pop='-'+d}
function step(){
 if(!B||B.over)return;
 if(M=='wb'&&B.tk++>=40)return wbEnd();
 B.al.forEach(u=>{if(u.hp>0&&u.ch<UM)u.ch++});if(S.auto)B.al.forEach((u,i)=>{if(u.hp>0&&u.ch>=UM)ult(i)});updUb();
 for(const u of B.al){
  if(u.hp<=0)continue;
  const E=B.en.filter(x=>x.hp>0);if(!E.length)break;
  u.n++;
  const k=X[u.id];if(u.n%k.cd==0){SK[u.id](u);continue}
  let d=u.atk*bf();if(u.t=='dmg'&&Math.random()<.2)d*=2;
  hit(E[0],Math.round(d));
 }
 if(B.en.every(x=>x.hp<=0)){win();return}
 if(B.buf>0)B.buf--;
 for(const x of B.en){
  if(x.hp<=0)continue;if(x.fr){x.fr=0;continue}
  const L=B.al.filter(u=>u.hp>0);if(!L.length)break;
  const t=L[Math.random()*L.length|0];dmgA(t,x.atk)}
 if(B.al.every(u=>u.hp<=0)){lose();return}
 draw()}
function win(){
 B.over=1;let g,m,d='';
 if(M=='tw'){const f=S.tw,b=f%10==0;g=Math.round(60*Math.pow(1.15,f));m=b?40:6+Math.floor(f/5);S.tw++;if(b)d=drop()}
 else{const s=S.stage,b=s%5==0;g=Math.round(40*Math.pow(1.15,s)*(b?3:1));m=b?30:8;if(!S.farm){if(s%10==0)m+=40;S.stage++;S.max=Math.max(S.max,S.stage)}if(b)d=drop()}
 g=Math.round(g*(1+rb('gold')+au('gold')+ru('gold')+vb('gold')));S.gold+=g;S.gems+=m;qp('win');
 toast('Победа! +'+g+' 🪙 +'+m+' 💎'+(d?' · '+d:''));save();hdr();draw();setTimeout(nb,900/S.sp)}
function lose(){B.over=1;
 if(M=='wb')return wbEnd();
 if(M=='tw'){toast('Башня: проиграл на этаже '+S.tw);M='st'}
 else{S.stage=Math.max(1,S.stage-1);S.farm=true;toast('Поражение! Отступаем на этап '+S.stage+' — фармим')}
 save();draw();setTimeout(nb,1500/S.sp)}
function wbEnd(){B.over=1;const d=B.dmg,g=Math.round(d/5),m=Math.min(100,20+Math.floor(d/1000));
 S.gold+=g;S.gems+=m;S.wb=dk();M='st';save();hdr();toast('Босс: урон '+d+' · +'+g+' 🪙 +'+m+' 💎');setTimeout(nb,1800)}
function ex(){if(M=='wb')return wbEnd();M='st';nb()}
function go(m){if(m=='wb'&&S.wb==dk())return;M=m;nb();showTab('b')}
function showTab(t){tab=t;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.t==t));fb();
 if(t=='b')draw();else if(t=='h')heroes();else if(t=='s')summon();else if(t=='r')relics();else if(t=='v')village();else modes()}
function relics(){
 $('#main').innerHTML=`<div class="hint">Реликвии падают с боссов и усиливают всю команду. Повторная находка — улучшение.</div><div class="grid" style="grid-template-columns:repeat(2,1fr)">`+R.map(x=>{const l=S.rel[x.id]||0;return `<div class="card r${l?2:1} ${l?'':'lock'}"><b>${x.e}</b><small>${x.n}</small><small>${l?'Ур. '+l+' · +'+Math.round(x.v*l*100)+'% '+x.d:'не найдена'}</small>${l?`<button class="btn alt" style="margin:6px 6px 0;width:calc(100% - 12px);flex:none;padding:6px" onclick="rup('${x.id}')">${rcost(l)} 🪙</button>`:''}</div>`}).join('')+'</div>'}
function rup(id){const l=S.rel[id],c=rcost(l);if(S.gold<c)return toast('Не хватает золота');S.gold-=c;S.rel[id]++;save();hdr();relics();M=='st'&&nb()}
function modes(){qd();const ok=S.wb!=dk();
 $('#main').innerHTML=`<div class="panel"><h2>🗼 Башня</h2><div class="hint">Этаж ${S.tw}. Без отступления: проиграл — выход. Босс и реликвия каждые 10 этажей.</div><div class="row"><button class="btn" onclick="go('tw')">Войти</button></div></div>
 <div class="panel"><h2>🐲 Мировой босс</h2><div class="hint">Одна попытка в день: 40 ударов, награда зависит от нанесённого урона.</div><div class="row"><button class="btn" ${ok?'':'disabled'} onclick="go('wb')">${ok?'В бой':'Завтра'}</button></div></div>
 <div class="panel"><h2>📜 Задания дня</h2>${Q.map(q=>{const p=Math.min(q.g,S.q.p[q.id]||0),c=S.q.c[q.id];return `<div class="row" style="align-items:center"><span style="flex:1">${q.n} <b>${p}/${q.g}</b></span><button class="btn alt" style="flex:none;padding:8px 10px" ${p<q.g||c?'disabled':''} onclick="qc('${q.id}')">${c?'✓':'+'+q.r+' 💎'}</button></div>`}).join('')}</div>`}
const V=[{id:'farm',n:'Ферма',e:'🌾',b:100,f:l=>'+'+Math.round(3*l*(1+ru('gold')))+' 🪙/сек'},{id:'forge',n:'Кузница',e:'⚒️',b:150,f:l=>'+'+4*l+'% урона команды'},{id:'inn',n:'Таверна',e:'🍺',b:150,f:l=>'+'+4*l+'% здоровья команды'},{id:'mkt',n:'Рынок',e:'🏪',b:200,f:l=>'+'+5*l+'% золота за победу'}];
const RU=[{k:'atk',n:'Сила предков',d:'+10% урона'},{k:'hp',n:'Стойкость',d:'+10% здоровья'},{k:'gold',n:'Жадность',d:'+15% золота'},{k:'start',n:'Запасы',d:'+200 золота при старте'}];
const vl=id=>S.vl[id]||0,vc=(v,l)=>Math.round(v.b*Math.pow(1.4,l)),rcs=k=>Math.round(3*Math.pow(1.5,S.ru[k]||0));
function ru(k){return (S.ru[k]||0)*({atk:.1,hp:.1,gold:.15}[k]||0)}
function vb(k){return {atk:.04*vl('forge'),hp:.04*vl('inn'),gold:.05*vl('mkt')}[k]||0}
function gps(){return 3*vl('farm')*(1+ru('gold'))}
const again=()=>Math.floor(S.max*S.max/20);
const SI={thor:'⚡',odin:'🔱',loki:'🗡️',freya:'💞',hel:'☠️',tyr:'🛡️',fen:'🦷',bal:'✨',ska:'🏹',hei:'📯'};
function fire(u,big){const i=B.al.indexOf(u),b=$('#sk'+i);if(!b)return;b.classList.add('fire');b.querySelector('small').textContent='';clearTimeout(b.k);b.k=setTimeout(()=>{b.classList.remove('fire');updUb()},700);
}
function updSp(){$('#sp').innerHTML='<span style="align-self:center;color:var(--mut);font-size:12px;margin-right:4px">Скорость</span>'+[1,2,4,8].map(v=>`<button class="${S.sp==v?'on':''}" onclick="spd(${v})">×${v}</button>`).join('')}
function spd(v){S.sp=v;save();clearInterval(tm);tm=setInterval(step,650/v);updSp()}
function ubuild(){$('#ub').innerHTML=B.al.map((u,i)=>`<button id="ub${i}" onclick="ult(${i})">${u.e}<small></small></button>`).join('')+'<button id="ua" style="flex:.6" onclick="S.auto=!S.auto;save();updUb()">🔁<small>Авто</small></button>';$('#sk').innerHTML=B.al.map((u,i)=>`<div class="sk1" id="sk${i}">${SI[u.id]}<small></small></div>`).join('');updUb()}
function updUb(){if(!B)return;B.al.forEach((u,i)=>{const b=$('#ub'+i);if(!b)return;const p=Math.min(100,u.ch/UM*100),rd=u.ch>=UM&&u.hp>0;b.style.setProperty('--p',p+'%');b.classList.toggle('rd',rd);b.disabled=!rd;const t=u.hp<=0?'☠':rd?'ГОТОВО':Math.round(p)+'%',sm=b.querySelector('small');if(sm.textContent!=t)sm.textContent=t;const k=$('#sk'+i);if(k){k.classList.toggle('rdy',rd);if(!k.classList.contains('fire')){const q=k.querySelector('small');if(q.textContent!=t)q.textContent=t}}});const a=$('#ua');if(a){a.classList.toggle('rd',!!S.auto);a.querySelector('small').textContent=S.auto?'вкл':'выкл'}}
function ult(i){const u=B&&B.al[i];if(!u||B.over||u.hp<=0||u.ch<UM||!en_().length)return;u.ch=0;PW=2.5;SK[u.id](u);PW=1;fire(u,1);updUb()}
function village(){
 const g=again();
 $('#main').innerHTML=V.map(v=>{const l=vl(v.id);return `<div class="panel" style="margin-top:8px"><div class="row" style="align-items:center;margin:0"><span style="font-size:28px">${v.e}</span><span style="flex:1"><b>${v.n}</b> · Ур. ${l}<br><span class="hint">${l?v.f(l):'не построено'}${l?' → '+v.f(l+1):' → '+v.f(1)}</span></span><button class="btn alt" style="flex:none;padding:8px 10px" onclick="vup('${v.id}')">${vc(v,l)} 🪙</button></div></div>`}).join('')+
 `<div class="panel"><h2>🌌 Вознесение</h2><div class="hint">Вознесение сбрасывает этапы, золото, уровни героев и деревню. Остаются герои, звёзды, реликвии, самоцветы и руны. Вознесений: ${S.asc}.</div>
 <div style="margin:8px 0">Награда сейчас: <b>${g>=5?'✨ '+g:'нужен рекорд этапа 10+'}</b> · руны: <b>✨ ${S.rn}</b></div>
 <div class="row"><button class="btn" ${g<5?'disabled':''} onclick="ascend()">${ar?'Точно? Нажми ещё раз':'Вознестись'}</button></div>
 ${RU.map(x=>`<div class="row" style="align-items:center"><span style="flex:1"><b>${x.n}</b> · Ур. ${S.ru[x.k]||0}<br><span class="hint">${x.d}</span></span><button class="btn alt" style="flex:none;padding:8px 10px" onclick="ruup('${x.k}')">${rcs(x.k)} ✨</button></div>`).join('')}</div>`}
function vup(id){const v=V.find(x=>x.id==id),c=vc(v,vl(id));if(S.gold<c)return toast('Не хватает золота');S.gold-=c;S.vl[id]=vl(id)+1;save();hdr();village();if(id!='farm'&&M=='st')nb()}
function ruup(k){const c=rcs(k);if(S.rn<c)return toast('Не хватает рун');S.rn-=c;S.ru[k]=(S.ru[k]||0)+1;save();hdr();village();if(M=='st')nb()}
function ascend(){const g=again();if(g<5)return;if(!ar){ar=1;village();return}
 ar=0;S.rn+=g;S.asc++;S.stage=1;S.max=1;S.farm=false;S.gold=300+200*(S.ru.start||0);S.vl={};
 for(const k in S.own)S.own[k].l=1;
 M='st';save();hdr();nb();village();toast('Вознесение! +'+g+' ✨')}
function unit(u){const p=u.pop?`<i class="pop">${u.pop}</i>`:'';u.pop='';
 return `<div class="u ${u.hp<=0?'dead':''}">${p}<b>${u.e}</b><div class="bar"><span style="width:${u.hp/u.mx*100}%"></span></div></div>`}
function draw(){
 if(tab!='b'||!B)return;
 const boss=S.stage%5==0;
 $('#main').innerHTML=`<div class="info"><span>${M=='tw'?'Этаж <b>'+S.tw+'</b>':M=='wb'?'Урон: <b>'+B.dmg+'</b> · ударов '+Math.max(0,40-B.tk):'Этап <b>'+S.stage+'</b>'+(boss?' · босс 🐉':'')}</span><span>Команда: <b>${S.team.length}/4</b></span></div>
 <div class="arena"><div class="col">${B.al.map(unit).join('')}</div><div class="col en">${B.en.map(unit).join('')}</div></div>
 <p class="hint">Бой идёт сам. Усиливай героев на вкладке «Герои», призывай новых на вкладке «Призыв». Прогресс сохраняется.</p>`}
function heroes(){
 const o=S.own[sel],h=get(sel);
 $('#main').innerHTML=`<div class="grid">${H.map(x=>{const q=S.own[x.id];return `<div class="card r${x.r} ${sel==x.id?'sel':''} ${q?'':'lock'}" onclick="pick('${x.id}')"><b>${x.e}</b><small>${x.n}</small><small>${q?'Ур. '+q.l+(q.s?' '+'★'.repeat(q.s):''):'не открыт'}</small>${S.team.includes(x.id)?'<em>⚔</em>':''}</div>`}).join('')}</div>
 <div class="panel"><h2>${h.e} ${h.n}</h2>${o?`<div>${CL[h.t]} · ❤ ${pw(sel,'hp')} · ⚔ ${pw(sel,'atk')}</div>${inf(sel)}
 <div class="row"><button class="btn" onclick="up()">Усилить · ${cost(o)} 🪙</button><button class="btn alt" onclick="tog()">${S.team.includes(sel)?'Убрать из команды':'В команду'}</button></div>`:`${inf(sel)}<div class="hint">Герой ещё не открыт. Найди его через призыв.</div>`}</div>`}
const cost=o=>Math.round(40*Math.pow(o.l,1.6));
function pick(id){sel=id;heroes()}
function up(){const o=S.own[sel],c=cost(o);if(S.gold<c)return toast('Не хватает золота');S.gold-=c;o.l++;qp('up');save();hdr();heroes();M=='st'&&nb()}
function tog(){
 const i=S.team.indexOf(sel);
 if(i>=0){if(S.team.length<2)return toast('В команде нужен хотя бы один герой');S.team.splice(i,1)}
 else{if(S.team.length>=4)return toast('Команда полна (4 героя)');S.team.push(sel)}
 save();heroes();M=='st'&&nb()}
function summon(){
 $('#main').innerHTML=`<div class="panel"><h2>Призыв героев</h2><div class="hint">Шансы: обычный 60%, редкий 30%, легендарный 10%. Повторный герой даёт звезду (+25% к силе, максимум 5).</div>
 <div class="row"><button class="btn" onclick="pull(1)">×1 · 100 💎</button><button class="btn" onclick="pull(10)">×10 · 900 💎</button></div>
 <div class="pulls">${res.map(r=>`<div class="card r${r.h.r}"><b>${r.h.e}</b><small>${r.h.n}</small><small>${r.t}</small></div>`).join('')}</div></div>`}
function pull(n){
 const c=n==10?900:100;if(S.gems<c)return toast('Не хватает самоцветов');
 S.gems-=c;res=[];qp('sum',n);
 for(let i=0;i<n;i++){
  const r=Math.random()*100,rar=r<10?3:r<40?2:1,P=H.filter(h=>h.r==rar),h=P[Math.random()*P.length|0],o=S.own[h.id];
  let t;if(!o){S.own[h.id]={l:1,s:0};t='новый!'}else if(o.s<5){o.s++;t='★ '+o.s}else{S.gold+=100;t='+100 🪙'}
  res.push({h,t})}
 save();hdr();summon()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>showTab(b.dataset.t));
const away=Math.min((Date.now()-S.t)/1000,28800),off=Math.floor(away*(1+S.stage*.8)*.5*(1+rb('off')))+Math.floor(away*gps()*.5);
if(off>20){S.gold+=off;setTimeout(()=>toast('Пока тебя не было: +'+off+' 🪙'),400)}
hdr();nb();updSp();tm=setInterval(step,650/S.sp);setInterval(()=>{const g=gps();if(g){S.gold+=g;hdr()}},1000);
</script>
</body>
</html>
